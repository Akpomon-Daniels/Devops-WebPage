<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscriptions Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Join Today</h1>
        <p>Choose a plan that works for you!</p>
    </header>

    <main>
        <section class="plans">
            <div class="plan">
                <h2>Standard Plan</h2>
                <p>£10/month</p>
                <ul>
                    <li>All Basic Plan features</li>
                    <li>Priority support</li>
                </ul>
                <button onclick="subscribe('Standard Plan')">Subscribe</button>
            </div>
            <div class="plan">
                <h2>Premium Plan</h2>
                <p>£20/month</p>
                <ul>
                    <li>All Standard Plan features</li>
                    <li>Personalized coaching</li>
                </ul>
                <button onclick="subscribe('Premium Plan')">Subscribe</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 FitZone Gym. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
